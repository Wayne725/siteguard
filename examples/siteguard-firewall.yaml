# 文件示範位址，須換成實際來源。observe 不封鎖；enforce 重新 up 才生效。
version: 1
name: siteguard
mode: observe
listener:
  host: 127.0.0.1
  port: 8088
upstream:
  url: http://host.docker.internal:8000
  protocol: http1
  preserve_host: true
hosts:
- '*'
policy:
  max_concurrent: 64
  queue_size: 16
  rate_per_second: 100
  burst: 200
  per_ip_rate: 20
  per_ip_burst: 40
  max_body_bytes: 10485760
  request_timeout_seconds: 30
  stream_idle_timeout_seconds: 300
routes: []
security:
  block_sensitive_paths: true
  blocked_methods:
  - TRACE
  - TRACK
  - CONNECT
  response_headers: true
  protected_paths: []
firewall:
  default_action: deny
  allow_cidrs:
  - 203.0.113.0/24
  - 2001:db8:1234::/48
  deny_cidrs:
  - 203.0.113.25
trusted_proxy_cidrs: []
trusted_proxy_hops: 0
