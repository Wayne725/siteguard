# 僅供自有 localhost fixture 測試；請勿直接用於正式網站。
version: 1
name: siteguard-usability-http
mode: enforce
listener:
  host: 127.0.0.1
  port: 18088
upstream:
  url: http://host.lima.internal:18100
  protocol: http1
  preserve_host: true
hosts:
- '*'
policy:
  max_concurrent: 4
  queue_size: 4
  rate_per_second: 100
  burst: 200
  per_ip_rate: 100
  per_ip_burst: 200
  max_body_bytes: 10485760
  request_timeout_seconds: 30
  stream_idle_timeout_seconds: 300
routes:
- name: events
  prefix: /events
  streaming: true
- name: heavy
  prefix: /heavy
  max_concurrent: 2
  rate_per_second: 4
  burst: 4
- name: websocket
  prefix: /ws
  streaming: true
security:
  block_sensitive_paths: true
  blocked_methods:
  - TRACE
  - TRACK
  - CONNECT
  response_headers: true
  protected_paths: []
firewall:
  default_action: allow
  allow_cidrs: []
  deny_cidrs: []
trusted_proxy_cidrs: []
trusted_proxy_hops: 0
