# 僅供自有 localhost fixture 測試；請勿直接用於正式網站。
version: 1
name: siteguard-usability-firewall
mode: observe
listener:
  host: 127.0.0.1
  port: 18090
upstream:
  url: http://host.lima.internal:18102
  protocol: http1
  preserve_host: true
hosts:
- '*'
policy:
  max_concurrent: 64
  queue_size: 16
  rate_per_second: 1000
  burst: 2000
  per_ip_rate: 1000
  per_ip_burst: 2000
  max_body_bytes: 10485760
  request_timeout_seconds: 30
  stream_idle_timeout_seconds: 300
routes:
- name: events
  prefix: /events
  streaming: true
- name: ws
  prefix: /ws
  streaming: true
security:
  block_sensitive_paths: false
  blocked_methods: []
  protected_paths: []
  response_headers: false
firewall:
  default_action: deny
  allow_cidrs: []
  deny_cidrs: []
trusted_proxy_cidrs: []
trusted_proxy_hops: 0
