name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt -r requirements-build.txt
      - name: Test gateway policies and configuration
        run: python -m unittest discover -s tests/siteguard -p 'test_*.py'
      - name: Test CLI
        run: python -m unittest discover -s tests -p 'test_cli.py'
      - name: Test deployment validation
        run: python -m unittest discover -s deploy -p 'test_*.py'
      - name: Test research RLS
        env:
          RUN_RLS_SOCKET_TESTS: '1'
        run: python -m unittest discover -s rls -p 'test_*.py'
      - name: Test comparison tools
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
