[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siteguard-gateway"
version = "0.3.0"
description = "A self-hosted Envoy protection gateway configured with Python"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Wayne725"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/Wayne725/siteguard"
Issues = "https://github.com/Wayne725/siteguard/issues"

[project.scripts]
siteguard = "siteguard.cli:main"

[tool.setuptools.packages.find]
include = ["siteguard*"]
